name: Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-safe-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        run: |
          python3 -m venv "$RUNNER_TEMP/uv"
          "$RUNNER_TEMP/uv/bin/pip" install --disable-pip-version-check 'uv==0.12.5'
          echo "$RUNNER_TEMP/uv/bin" >> "$GITHUB_PATH"
      - name: Run CPU-safe test suite
        run: |
          PYTHONPATH=python uv run --python 3.11 --no-project \
            --with pytest --with fastapi --with uvicorn --with pydantic --with httpx \
            python -m pytest \
            tests/test_docs_contract.py \
            tests/daemon/test_daemon_import_safety.py \
            tests/daemon/test_daemon_serve_manager.py \
            tests/test_mlx_cache.py \
            tests/test_mlx_cli.py -q
      - name: Compile Python sources
        run: python3 -m compileall -q python

  mlx-tests:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        run: |
          python3 -m venv "$RUNNER_TEMP/uv"
          "$RUNNER_TEMP/uv/bin/pip" install --disable-pip-version-check 'uv==0.12.5'
          echo "$RUNNER_TEMP/uv/bin" >> "$GITHUB_PATH"
      - name: Run Apple Silicon (MLX) test suite
        run: |
          PYTHONPATH=python uv run --python 3.11 --no-project \
            --with pytest --with mlx \
            python -m pytest \
            tests/test_mlx_backend.py \
            tests/test_mlx_quantize_experts.py -q
